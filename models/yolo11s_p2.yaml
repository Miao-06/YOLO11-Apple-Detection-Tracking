# ============================================================
# YOLO11s-P2
#
# 在标准 YOLO11s 基础上新增 P2/4 检测层
#
# Detect:
#   P2 / stride 4   -> 极小目标
#   P3 / stride 8   -> 小目标
#   P4 / stride 16  -> 中目标
#   P5 / stride 32  -> 大目标
# ============================================================


# ============================================================
# Parameters
# ============================================================

# 当前项目只有一个类别：pingguo
nc: 1

# 明确指定 Small 规模
scale: s

# YOLO11 compound scaling
# [depth, width, max_channels]
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]


# ============================================================
# Backbone
#
# 与官方 YOLO11 保持一致
# ============================================================

backbone:

  # [from, repeats, module, args]

  # P1 / 2
  - [-1, 1, Conv, [64, 3, 2]]

  # P2 / 4
  - [-1, 1, Conv, [128, 3, 2]]

  # layer 2
  # 这里的输出后面会给新增的 P2 Head 使用
  - [-1, 2, C3k2, [256, False, 0.25]]

  # P3 / 8
  - [-1, 1, Conv, [256, 3, 2]]

  # layer 4
  - [-1, 2, C3k2, [512, False, 0.25]]

  # P4 / 16
  - [-1, 1, Conv, [512, 3, 2]]

  # layer 6
  - [-1, 2, C3k2, [512, True]]

  # P5 / 32
  - [-1, 1, Conv, [1024, 3, 2]]

  # layer 8
  - [-1, 2, C3k2, [1024, True]]

  # layer 9
  - [-1, 1, SPPF, [1024, 5]]

  # layer 10
  - [-1, 2, C2PSA, [1024]]


# ============================================================
# Head
#
# 标准 YOLO11：
#
# P5
# ↓
# P4
# ↓
# P3
#
# 本模型继续：
#
# P3
# ↓
# P2     <-- 新增
#
# 然后 PAN 再逐层向下融合：
#
# P2 -> P3 -> P4 -> P5
# ============================================================

head:

  # ----------------------------------------------------------
  # P5 -> P4
  # ----------------------------------------------------------

  # 11
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]

  # 12
  # 与 backbone P4 融合
  - [[-1, 6], 1, Concat, [1]]

  # 13
  - [-1, 2, C3k2, [512, False]]


  # ----------------------------------------------------------
  # P4 -> P3
  # ----------------------------------------------------------

  # 14
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]

  # 15
  # 与 backbone P3 融合
  - [[-1, 4], 1, Concat, [1]]

  # 16
  # P3 / 8
  - [-1, 2, C3k2, [256, False]]


  # ----------------------------------------------------------
  # 新增：
  # P3 -> P2
  # ----------------------------------------------------------

  # 17
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]

  # 18
  # 与 backbone layer 2 的 P2 特征融合
  - [[-1, 2], 1, Concat, [1]]

  # 19
  # P2 / 4
  # 新增的小目标检测特征层
  - [-1, 2, C3k2, [128, False]]


  # ==========================================================
  # PAN Bottom-up
  # ==========================================================

  # ----------------------------------------------------------
  # P2 -> P3
  # ----------------------------------------------------------

  # 20
  - [-1, 1, Conv, [128, 3, 2]]

  # 21
  # 与前面的 P3 特征融合
  - [[-1, 16], 1, Concat, [1]]

  # 22
  # P3 / 8
  - [-1, 2, C3k2, [256, False]]


  # ----------------------------------------------------------
  # P3 -> P4
  # ----------------------------------------------------------

  # 23
  - [-1, 1, Conv, [256, 3, 2]]

  # 24
  - [[-1, 13], 1, Concat, [1]]

  # 25
  # P4 / 16
  - [-1, 2, C3k2, [512, False]]


  # ----------------------------------------------------------
  # P4 -> P5
  # ----------------------------------------------------------

  # 26
  - [-1, 1, Conv, [512, 3, 2]]

  # 27
  # 与 backbone P5 高层语义特征融合
  - [[-1, 10], 1, Concat, [1]]

  # 28
  # P5 / 32
  - [-1, 2, C3k2, [1024, True]]


  # ==========================================================
  # Detect
  #
  # 4 个尺度：
  #
  # 19 -> P2 / 4
  # 22 -> P3 / 8
  # 25 -> P4 / 16
  # 28 -> P5 / 32
  # ==========================================================

  - [[19, 22, 25, 28], 1, Detect, [nc]]
  