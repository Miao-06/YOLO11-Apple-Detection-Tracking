# ============================================================
# Exp004
#
# YOLO11s + P2 Small Object Detection Head
#
# 目的：
# 改善小苹果、远距离苹果的检测召回
#
# 与 Exp003 对比时：
#
# 数据集不变
# imgsz 不变
# Hard Negative 不变
# 增强策略不变
#
# 只改变模型结构：加入 P2
# ============================================================


# ============================================================
# Model
# ============================================================

model: E:/workspace/01_Projects/AI_Vision_Learning/Fruit_YOLO/models/yolo11s_p2.yaml


# ============================================================
# Pretrained weights
#
# 非常重要：
#
# 模型结构虽然改成了 P2，
# 但是仍然尽量加载标准 yolo11s.pt 中
# 可以匹配的预训练权重。
#
# 新增 P2 部分会重新初始化。
# ============================================================

pretrained: E:/workspace/01_Projects/AI_Vision_Learning/Fruit_YOLO/yolo11s.pt


# ============================================================
# Dataset
# ============================================================

data: E:/workspace/01_Projects/AI_Vision_Learning/Fruit_YOLO/data/dataset.yaml


# ============================================================
# Training
# ============================================================

epochs: 100

imgsz: 960

# P2 会引入更大的高分辨率特征图，
# 显存会比 Exp003 更高。
#
# RTX 4060 Laptop 8GB 先继续 batch=4。
batch: 2

workers: 4

device: 0


# ============================================================
# Optimizer
# ============================================================

optimizer: auto


# ============================================================
# Reproducibility
# ============================================================

seed: 42

deterministic: true


# ============================================================
# Early stopping
# ============================================================

patience: 30


# ============================================================
# Save / Validation
# ============================================================

save: true

save_period: -1

val: true

plots: true

amp: true

cache: false


# ============================================================
# Data Augmentation
#
# 和 Exp003 保持一致。
# 这轮不要额外增加新的变量。
# ============================================================

hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4

degrees: 0.0

translate: 0.1

scale: 0.5

shear: 0.0

perspective: 0.0

flipud: 0.0

fliplr: 0.5

mosaic: 1.0

mixup: 0.0

copy_paste: 0.0


# ============================================================
# Output
# ============================================================

project: E:/workspace/01_Projects/AI_Vision_Learning/Fruit_YOLO/runs/detect

name: Exp004_YOLO11s_P2_960

exist_ok: false
